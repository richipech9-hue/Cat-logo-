<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOPRO - Venta de Motos y Deshueso</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
header { background: #ff0000; color: #333; padding: 15px 20px; display: flex; align-items: center; gap: 10px; }
header h1 { margin: 0; font-size: 1.8em; display: flex; align-items: center; gap: 10px; }
header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
.productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
.producto { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; cursor: pointer; transition: transform 0.2s; }
.producto:hover { transform: scale(1.02); }
.producto img { width: 100%; height: 180px; object-fit: cover; }
.producto-info { padding: 15px; }
.precio { color: #008f39; font-weight: bold; }
.boton-whatsapp { display: inline-flex; align-items: center; background: #25d366; color: white; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; }
.boton-whatsapp img { width: 20px; height: 20px; margin-right: 8px; }
footer { background: #222; color: white; text-align: center; padding: 10px; }
#galeriaModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
#galeriaModal img { max-width: 90%; max-height: 80%; margin: 10px; border-radius: 10px; }
#galeriaModal button { background: red; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
@media (max-width: 600px) { .productos { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
    <h1><img src="imagenes/honda_cb500.jpg" alt="Moto logo"> MOTOPRO</h1>
</header>

<main class="productos" id="listaProductos"></main>

<div id="galeriaModal" onclick="cerrarGaleria()">
    <div id="galeriaContenido"></div>
    <button onclick="cerrarGaleria()">Cerrar</button>
</div>

<footer>© 2025 MOTOPRO — Venta de motos y refacciones de deshueso.</footer>

<script>
async function mostrarProductos() {
    const contenedor = document.getElementById("listaProductos");
    contenedor.innerHTML = "";
    try {
        // Listado de archivos JSON en la carpeta /productos
        const respuesta = await fetch('productos/index.json');
        const archivos = await respuesta.json(); // index.json tendrá lista de archivos: ["honda_cb500.json","yamaha_r3.json"]
        
        for (const archivo of archivos) {
            const resProd = await fetch('productos/' + archivo);
            const p = await resProd.json();

            const div = document.createElement("div");
            div.classList.add("producto");
            div.innerHTML = `
                <img src="${p.imagenPrincipal}" alt="${p.titulo}">
                <div class="producto-info">
                    <h3>${p.titulo}</h3>
                    <p class="precio">$${p.precio} MXN</p>
                    <p>${p.descripcion}</p>
                    <a class="boton-whatsapp" target="_blank"
                        href="https://wa.me/${p.whatsapp}?text=Hola,%20estoy%20interesado%20en%20${encodeURIComponent(p.titulo)}">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"> Comprar
                    </a>
                </div>`;
            div.addEventListener("click", e => {
                if (!e.target.closest("button") && !e.target.closest("a")) abrirGaleria(p);
            });
            contenedor.appendChild(div);
        }
    } catch (err) {
        contenedor.innerHTML = "<p>No se pudieron cargar los productos.</p>";
        console.error(err);
    }
}

// Modal de galería
function abrirGaleria(p) {
    const modal = document.getElementById("galeriaModal");
    const cont = document.getElementById("galeriaContenido");
    cont.innerHTML = `<img src="${p.imagenPrincipal}" alt="Foto principal">`;
    p.imagenesExtras.forEach(f => cont.innerHTML += `<img src="${f}" alt="Foto extra">`);
    modal.style.display = "flex";
}
function cerrarGaleria() { document.getElementById("galeriaModal").style.display = "none"; }

mostrarProductos();
</script>

</body>
</html>
